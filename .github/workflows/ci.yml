name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install additional shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - name: Check Unix installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { $parseErrors | Format-List; exit 1 }
      - run: mise exec -- go test ./...
      - run: mise exec -- go vet ./...
      - run: mise exec -- go build ./cmd/easyvenv
      - name: Race detector
        if: runner.os == 'Linux'
        run: mise exec -- go test -race ./...
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ inputs.version || 'dev' }}
        run: |
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          mkdir -p dist
          mise exec -- go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/easyvenv$suffix" ./cmd/easyvenv
          cp "dist/easyvenv$suffix" "dist/venv$suffix"
      - uses: actions/upload-artifact@v4
        with:
          name: easyvenv-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
