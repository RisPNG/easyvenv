name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install additional shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish zsh
      - run: mise exec -- go test ./...
      - run: mise exec -- go vet ./...
      - run: mise exec -- go build ./cmd/easyvenv
      - name: Race detector
        if: runner.os == 'Linux'
        run: mise exec -- go test -race ./...
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          mkdir -p dist
          mise exec -- go build -trimpath -o "dist/easyvenv$suffix" ./cmd/easyvenv
          cp "dist/easyvenv$suffix" "dist/venv$suffix"
      - uses: actions/upload-artifact@v4
        with:
          name: easyvenv-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
